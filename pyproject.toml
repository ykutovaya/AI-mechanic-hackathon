[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mechanic"
version = "0.1.0"
description = "Инструменты цифрового механика"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF==1.26.7",
    "filelock>=3.13,<4",
    "qdrant-client==1.20.0",
    "fastembed==0.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]
